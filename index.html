<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Лампа</title>

<style>
  body {
    text-align: center;
    font-family: Arial;
    margin-top: 50px;
    background: #111;
    color: white;
  }

  /* ЛАМПА */
  .lamp {
    width: 120px;
    height: 160px;
    background: #444;
    border-radius: 60% 60% 50% 50%;
    margin: 20px auto;
    position: relative;
    transition: 0.3s;
  }

  /* патрон */
  .lamp::after {
    content: "";
    width: 60px;
    height: 40px;
    background: #222;
    position: absolute;
    bottom: -30px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 5px;
  }

  /* включенная лампа */
  .on {
    background: radial-gradient(circle, #fff176, #fbc02d);
    box-shadow: 0 0 40px #ffeb3b, 0 0 80px #fdd835;
  }

  /* КНОПКИ */
  button {
    padding: 12px 25px;
    margin: 10px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
  }

  .on-btn {
    background: #4caf50;
    color: white;
  }

  .on-btn:hover {
    background: #66bb6a;
  }

  .off-btn {
    background: #f44336;
    color: white;
  }

  .off-btn:hover {
    background: #ef5350;
  }
</style>
</head>

<body>

<h2>💡 Лампа</h2>

<div id="lamp" class="lamp"></div>

<button class="on-btn" onclick="turnOn()">ON</button>
<button class="off-btn" onclick="turnOff()">OFF</button>

<script>
  function turnOn() {
    document.getElementById("lamp").classList.add("on");
  }

  function turnOff() {
    document.getElementById("lamp").classList.remove("on");
  }
</script>

</body>
</html>
